seed: 2025

data:
  n_splits: 5
  kfold_seed: 42
  max_length: 1024
  max_train_samples: -1
  max_val_samples: -1

model:
  model_name: /root/data/models/Qwen3.5-9B

hub:
  local_files_only: true
  token: ""

lora:
  r: 64
  alpha: 128
  dropout: 0.03

train:
  batch_size: 2
  eval_batch_size: 2
  grad_accum: 8
  num_epochs: 3
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  logging_steps: 10
  save_total_limit: 2
  fp16: false
  bf16: true
  optim: paged_adamw_8bit

inference:
  max_prompt_length: 1024
  max_new_tokens: 320
  batch_size: 2
