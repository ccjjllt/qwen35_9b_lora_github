seed: 42

data:
  n_splits: 5
  kfold_seed: 42
  max_length: 640
  max_train_samples: 400
  max_val_samples: 120

model:
  model_name: Qwen/Qwen3.5-9B

hub:
  local_files_only: false
  token: ""

lora:
  r: 8
  alpha: 16
  dropout: 0.05

train:
  batch_size: 1
  eval_batch_size: 1
  grad_accum: 8
  num_epochs: 1
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  logging_steps: 10
  save_total_limit: 2
  fp16: false
  bf16: true
  optim: paged_adamw_8bit

inference:
  max_prompt_length: 640
  max_new_tokens: 192
  batch_size: 1
